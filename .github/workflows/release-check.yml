name: Release check

# Full test suite and 100% line coverage. Run it on the release commit and require it green
# before tagging and packaging (DISTRIBUTION.md). Runs on tag pushes and on demand only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to check
        default: main
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: full tests and coverage
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-llvm-cov

      # test_tray_manager_lifecycle needs an interactive desktop; --smoke-test covers it locally.
      - name: cargo test
        run: cargo test --locked -- --test-threads=1 --skip test_tray_manager_lifecycle

      # Regex over file paths built from scripts/coverage-exclude.txt: dots escaped, either path separator.
      - name: Build coverage ignore regex
        shell: pwsh
        run: |
          $paths = Get-Content scripts/coverage-exclude.txt |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith('#') }
          $alternatives = $paths | ForEach-Object { [regex]::Escape($_).Replace('/', '[\\/]') }
          $regex = '(^|[\\/])(' + ($alternatives -join '|') + ')$'
          "COVERAGE_IGNORE_REGEX=$regex" | Add-Content -Path $env:GITHUB_ENV
          "Coverage excludes $($paths.Count) files from scripts/coverage-exclude.txt." | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --lcov --output-path lcov.info --fail-under-lines 100 --ignore-filename-regex "$env:COVERAGE_IGNORE_REGEX" -- --test-threads=1 --skip test_tray_manager_lifecycle

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo llvm-cov report --summary-only --show-missing-lines --ignore-filename-regex "$env:COVERAGE_IGNORE_REGEX" | Tee-Object -FilePath coverage-summary.txt
          '```text', (Get-Content coverage-summary.txt), '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt
          retention-days: 30
          if-no-files-found: warn

  worker:
    name: worker coverage
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: worker syntax
        run: node --check cloudflare/worker.mjs

      # The pnpm version comes from "packageManager" in cloudflare/package.json.
      - name: Set up pnpm
        if: hashFiles('cloudflare/package.json') != ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: cloudflare/package.json

      - name: Install Worker dependencies
        if: hashFiles('cloudflare/package.json') != ''
        run: pnpm --dir cloudflare install --frozen-lockfile

      - name: Worker tests
        if: hashFiles('cloudflare/package.json') != ''
        run: pnpm --dir cloudflare test

      # The coverage script enforces its own 100% thresholds.
      - name: Worker coverage
        if: hashFiles('cloudflare/package.json') != ''
        shell: pwsh
        run: |
          $scripts = (Get-Content cloudflare/package.json -Raw | ConvertFrom-Json).scripts
          if ($scripts -and $scripts.PSObject.Properties['coverage']) {
              pnpm --dir cloudflare run coverage
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
              Write-Host 'cloudflare/package.json has no coverage script; skipped.'
          }
