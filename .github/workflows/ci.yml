name: CI

# Small, separate jobs. Tests are chosen per change by scripts/ci-test-plan.ps1;
# the full suite and coverage run in release-check.yml. No secrets, signing or release steps.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its run. Each push to main has a group of its own,
# so none is cancelled or dropped while pending: its plan tests only the commits of that push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the channel and components (rustfmt, clippy).
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo fmt
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  plan:
    name: plan
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      filters: ${{ steps.plan.outputs.filters }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      worker: ${{ steps.plan.outputs.worker }}
    steps:
      # The plan diffs against the base commit, so it needs the full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose tests
        id: plan
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci-test-plan.ps1 -Base $env:BASE_SHA -Head $env:HEAD_SHA

  test:
    name: test (${{ matrix.filter }})
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        filter: ${{ fromJSON(needs.plan.outputs.filters) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # test_tray_manager_lifecycle needs an interactive desktop; --smoke-test covers it locally.
      - name: cargo test
        run: cargo test --locked ${{ matrix.filter }} -- --test-threads=1 --skip test_tray_manager_lifecycle

  worker:
    name: worker
    needs: plan
    if: needs.plan.outputs.worker == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: worker syntax
        run: node --check cloudflare/worker.mjs

      # The pnpm version comes from "packageManager" in cloudflare/package.json.
      - name: Set up pnpm
        if: hashFiles('cloudflare/package.json') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloudflare/package.json

      - name: Install Worker dependencies
        if: hashFiles('cloudflare/package.json') != ''
        run: pnpm --dir cloudflare install --frozen-lockfile

      - name: Worker tests
        if: hashFiles('cloudflare/package.json') != ''
        run: pnpm --dir cloudflare test

  build:
    name: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release

      - name: cargo build
        run: cargo build --release --locked

      - name: Name the artifact
        id: meta
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $name = "isolmass-$($env:HEAD_SHA.Substring(0, 7))"
          "name=$name" | Add-Content -Path $env:GITHUB_OUTPUT
          "Unsigned build for review: artifact ``$name`` (isolmass.exe, kept 14 days). Not a release." | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}
          path: target/release/isolmass.exe
          retention-days: 14
          if-no-files-found: error
